name: Feature request
description: Propose an enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the pipeline doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: How might it work? If it's a new adapter/verifier/grader, note whether it belongs in core or in a consumer plugin pack (see CONTRIBUTING.md "Extending the pipeline").
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
